name: Construire l'APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Creer le projet
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Moodmix</title>
          <style>
          :root{--bg:#0a1030;--bg2:#141c4d;--eye:#22c8f0;--eye2:#2de0d0;--edge:#2a2fd8;color-scheme:dark}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
          html,body{height:100%;margin:0}
          body{background:radial-gradient(ellipse at 50% 40%,var(--bg2),var(--bg) 75%);overflow:hidden;touch-action:manipulation}
          #eyes{height:100%;display:flex;align-items:center;justify-content:center;gap:8vw;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
          .eye{width:min(30vw,38vh);height:min(52vw,62vh);background:linear-gradient(160deg,var(--eye),var(--eye2));border:6px solid var(--edge);border-radius:32px;animation:blink 5s infinite}
          body.listen .eye{box-shadow:0 0 50px var(--eye)}
          body.think .eye,body.talk .eye{animation:pulse .6s infinite alternate}
          body.err .eye{border-color:#ff7a8a;box-shadow:0 0 40px #ff7a8a}
          #dbg{position:fixed;left:0;right:0;bottom:0;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));font:13px sans-serif;color:#8c97c9;text-align:center;pointer-events:none}
          @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
          @keyframes pulse{to{filter:brightness(1.35)}}
          </style></head>
          <body>
          <div id="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div id="dbg">Touche les yeux.</div>
          <script src="config.js"></script>
          <script>
          var SYS="Tu es Moodmix, une IA cuisinière avec deux grands yeux. Tu parles à voix haute, en français québécois simple, en 1 à 3 phrases courtes, sans listes ni symboles. L’utilisateur te demande une boisson avec un goût précis (limonade, orage…). Donne les ingrédients, demande ce qu’il a ou n’a pas, propose des substituts, puis guide-le étape par étape. Quand il envoie des photos, dis ce que tu vois et valide ou non les ingrédients.";
          var key=window.GEMINI_KEY||localStorage.getItem("key")||"";
          var P=(window.Capacitor&&window.Capacitor.Plugins)||{};
          var SR=P.SpeechRecognition,TT=P.TextToSpeech;
          var live=false,busy=false,speaking=false,msgs=[],et=null;
          function dbg(t){document.getElementById("dbg").textContent=t}
          function mode(c,on){document.body.classList.toggle(c,on)}
          function flash(){mode("err",true);clearTimeout(et);et=setTimeout(function(){mode("err",false)},2000)}
          function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
          function say(t){
            speaking=true;mode("talk",true);
            var guard=null;
            var end=function(){clearTimeout(guard);speaking=false;mode("talk",false)};
            guard=setTimeout(end,30000);
            if(TT){TT.speak({text:t,lang:"fr-CA",rate:1,pitch:1,volume:1,category:"ambient"}).then(end).catch(function(e){dbg("Voix: "+(e&&e.message||e));end()});return}
            try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-CA";u.onend=end;u.onerror=end;speechSynthesis.speak(u)}catch(e){end()}
          }
          function getKey(){if(key)return true;var k=prompt("Clé API Gemini (une seule fois)","");if(k){key=k.trim();localStorage.setItem("key",key)}return !!key}
          function b64(f){return new Promise(function(r){var x=new FileReader();x.onload=function(){r({inline_data:{mime_type:f.type||"image/jpeg",data:x.result.split(",")[1]}})};x.readAsDataURL(f)})}
          async function send(parts){
            busy=true;mode("think",true);dbg("Je réfléchis…");msgs.push({role:"user",parts:parts});
            try{
              var r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({system_instruction:{parts:[{text:SYS}]},contents:msgs})});
              var d=await r.json().catch(function(){return {}});
              if(!r.ok){if(r.status==400||r.status==403){key="";localStorage.removeItem("key")}throw new Error("Gemini "+r.status+": "+((d.error&&d.error.message)||""))}
              var t=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts[0].text)||"").replace(/[*#_`]/g,"").trim()||"Je n’ai pas compris, redis-le.";
              msgs.push({role:"model",parts:[{text:t}]});dbg(t);say(t);
            }catch(e){msgs.pop();dbg("Erreur: "+(e&&e.message||e));flash()}
            busy=false;mode("think",false);
          }
          async function loop(){
            while(live){
              if(busy||speaking){await sleep(300);continue}
              try{
                mode("listen",true);dbg("Je t’écoute…");
                var r=await SR.start({language:"fr-CA",maxResults:1,partialResults:false,popup:false});
                mode("listen",false);
                var t=r&&r.matches&&r.matches[0];
                if(t&&live){dbg("« "+t+" »");await send([{text:t}])}else dbg("Rien entendu…");
              }catch(e){mode("listen",false);dbg("Micro: "+(e&&e.message||e));await sleep(800)}
            }
          }
          async function toggle(){
            if(live){live=false;try{SR.stop()}catch(e){}try{TT&&TT.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}speaking=false;mode("talk",false);mode("listen",false);dbg("Arrêté. Touche les yeux.");return}
            if(!SR){dbg("Plugin micro introuvable");flash();return}
            if(!getKey()){dbg("Il faut une clé Gemini");flash();return}
            try{
              var av=await SR.available();
              if(!av.available){dbg("Reconnaissance vocale absente sur ce téléphone");flash();return}
              var p=await SR.requestPermissions();
              if(p.speechRecognition!=="granted"){dbg("Permission micro refusée");flash();return}
            }catch(e){dbg("Micro: "+(e&&e.message||e));flash();return}
            live=true;loop();
          }
          var pick=document.createElement("input");pick.type="file";pick.accept="image/*";pick.multiple=true;
          pick.onchange=async function(){
            var f=Array.prototype.slice.call(pick.files);pick.value="";
            if(!f.length||!getKey())return;
            var imgs=await Promise.all(f.map(b64));
            send([{text:"Voici mes ingrédients en photo. Qu’est-ce que tu en penses?"}].concat(imgs));
          };
          var lp=null,long=false,eyes=document.getElementById("eyes");
          eyes.addEventListener("pointerdown",function(){long=false;lp=setTimeout(function(){long=true;pick.click()},650)});
          eyes.addEventListener("pointerup",function(){clearTimeout(lp);if(!long)toggle()});
          eyes.addEventListener("pointerleave",function(){clearTimeout(lp)});
          </script></body></html>
          EOF
          echo "window.GEMINI_KEY='${{ secrets.GEMINI_API_KEY }}';" > www/config.js
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/speech-recognition@6
          npm install @capacitor-community/text-to-speech@6 || echo "tts absent"
          npm install @capacitor/assets@3
          echo '{"appId":"com.moodmix.app","appName":"Moodmix","webDir":"www"}' > capacitor.config.json
          npx cap add android
          mkdir -p assets
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Construire
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Moodmix APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
